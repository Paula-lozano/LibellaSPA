<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galería de diseños de manicure, pedicure y uñas acrílicas de AL Beauty Studio.">
  <title>Galería de diseños | AL Beauty Studio</title>

  <!-- Imagen del encabezado con prioridad (mejora el LCP) -->
  <link rel="preload" as="image" href="Imagenes/FondoBanner.jpg" fetchpriority="high">

  <link rel="stylesheet" href="Galeria.css?v=4">

  <!-- Fuente cargada sin bloquear el pintado de la página -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap"></noscript>

  <style>
    .tabs-galeria { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:10px auto 0; }
    .tabs-galeria a, .btn-reservar-galeria { padding:8px 16px; border-radius:999px; border:2px solid #b0004f; color:#b0004f; text-decoration:none; font-weight:700; font-family: Arial, sans-serif; background:#fff; }
    .tabs-galeria a[aria-current="page"], .btn-reservar-galeria { background:#b0004f; color:#fff; }
    .acciones-galeria { text-align:center; margin:24px 0; }
    .icono { color:#b0004f; margin-right:4px; }
  </style>
</head>

<body>
  <header class="banner-galeria">
    <h1>Galería de Diseños</h1>
    <a href="index.html" class="btn-volver">← Volver al inicio</a>
  </header>

  <nav class="tabs-galeria" aria-label="Servicios de la galería">
    <a href="Galeria.html?servicio=manicure" data-servicio="manicure">Manicure</a>
    <a href="Galeria.html?servicio=pedicure" data-servicio="pedicure">Pedicure</a>
    <a href="Galeria.html?servicio=acrilicas" data-servicio="acrilicas">Acrílicas</a>
  </nav>

  <main>
    <section id="titulo-servicio">
      <h2 style="text-align: center; color: #b0004f;">Diseños de Manicure</h2>
    </section>

    <section class="galeria" id="galeria-contenido" aria-live="polite"></section>

    <div class="acciones-galeria">
      <a id="btn-reservar-galeria" class="btn-reservar-galeria" href="index.html#citas">Reservar este servicio ↗</a>
    </div>
  </main>

  <!-- Se ejecuta antes del pie de página para que las fotos se inserten
       antes del primer pintado y el contenido no "salte" (CLS). -->
  <script src="Galeria.js?v=4"></script>

  <footer class="footer">
    <p><span class="icono" aria-hidden="true">✦</span> AL Beauty Studio</p>
    <p><span class="icono" aria-hidden="true">◎</span> Instagram: @libella.cute</p>
    <p><span class="icono" aria-hidden="true">✆</span> 301 750 1031</p>
  </footer>
</body>
</html>
