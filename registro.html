
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | AL Beauty Studio</title>

    <!-- Fuentes utilizadas en AL Beauty Studio -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Estilos de la página de registro -->
    <link rel="stylesheet" href="registro.css">

</head>

<body>

    <!-- ENCABEZADO -->
    <header class="register-header">

        <a href="index.html" class="brand">
            ✦ AL Beauty
            <small>NAIL &amp; BEAUTY STUDIO</small>
        </a>

        <a href="index.html" class="back-home">
            ← Volver al inicio
        </a>

    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="register-main">

        <section class="register-card">

            <div class="register-icon">✦</div>

            <p class="register-kicker">
                BIENVENIDA A AL BEAUTY STUDIO
            </p>

            <h1>Crear cuenta</h1>

            <p class="register-description">
                Regístrate para disfrutar de nuestros
                servicios y gestionar tus próximas citas.
            </p>

            <!-- FORMULARIO DE REGISTRO -->
            <form id="form-registro">

                <div class="form-group">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre completo"
                        autocomplete="name"
                        required>

                </div>

                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="correo@ejemplo.com"
                        autocomplete="email"
                        required>

                </div>

                <div class="form-group">

                    <label for="documento">
                        Número de documento
                    </label>

                    <input
                        type="text"
                        id="documento"
                        name="documento"
                        placeholder="Cédula o documento de identidad"
                        inputmode="numeric"
                        pattern="[0-9]{5,12}"
                        maxlength="12"
                        required>

                </div>

                <div class="form-group">

                    <label for="telefono">
                        Celular (WhatsApp)
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="Ej. 3001234567"
                        autocomplete="tel"
                        inputmode="numeric"
                        maxlength="13"
                        required>

                </div>

                <div class="form-group">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                </div>

                <div class="form-group">

                    <label for="confirmar-contrasena">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar-contrasena"
                        name="confirmar-contrasena"
                        placeholder="Repite tu contraseña"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                </div>

                <label class="consentimiento" style="display:flex;gap:8px;align-items:flex-start;font-size:13px;text-align:left;">
                    <input type="checkbox" id="acepta-datos" required style="width:auto;margin-top:3px;">
                    <span>Autorizo a AL Beauty Studio a tratar mis datos personales para gestionar mis citas y facturas, conforme a la Ley 1581 de 2012.</span>
                </label>

                <!-- Mensajes de validación -->
                <p
                    id="mensaje-registro"
                    class="register-message"
                    role="status"
                    aria-live="polite">
                </p>

                <button
                    type="submit"
                    class="register-button">
                    Crear mi cuenta
                </button>

            </form>

            <div class="login-access">

                <p>¿Ya tienes una cuenta?</p>

                <a href="login.html">
                    Iniciar sesión
                </a>

            </div>

            <p class="register-footer">
                Tu momento de brillar comienza aquí.
            </p>

        </section>

    </main>

    <!-- REGISTRO DE CLIENTES CON FIREBASE -->
<script type="module" src="registro.js"></script>

</body>
</html>
