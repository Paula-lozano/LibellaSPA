<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simulador de colorimetría de AL Beauty Studio: recibe una paleta de esmaltes según tu tono y subtono de piel.">
  <title>Simulador de colorimetría | AL Beauty Studio</title>
  <!-- Imagen del encabezado con prioridad (mejora el LCP) -->
  <link rel="preload" as="image" href="Imagenes/FondoBanner.jpg" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fuentes cargadas sin bloquear el pintado de la página -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:wght@600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:wght@600&display=swap"></noscript>
  <!-- Estilos incorporados en la página (CSS crítico): evitan una petición
       adicional que bloqueaba el primer pintado (mejora el LCP). -->
  <style>
/* ==========================================
   AL BEAUTY STUDIO - SIMULADOR DE COLORIMETRÍA
========================================== */

:root {
  --rosa: #b0185a;
  --rosa-hover: #8f1249;
  --tinta: #3f2a37;
  --borde: #ecd3df;
}

* { box-sizing: border-box; }

body {
  font-family: "DM Sans", Arial, sans-serif;
  background: #fdeef5 url("Imagenes/FondoContColorimetria.jpg") center / cover fixed;
  color: var(--tinta);
  margin: 0;
  padding: 16px;
}

.banner {
  position: relative;
  background: #4a1d33 url("Imagenes/FondoBanner.jpg") center / cover;
  color: #fff;
  padding: 2em 1em;
  text-align: center;
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1em;
}

.banner::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(40, 10, 25, 0.6);
}

.banner > * { position: relative; }

.banner h1 {
  font-family: "Playfair Display", Georgia, serif;
  margin: 0;
  font-size: clamp(24px, 4vw, 38px);
}

.banner p { margin: 0; max-width: 620px; }

.btn-volver {
  display: inline-block;
  background: #fff;
  color: var(--rosa);
  padding: 0.6em 1.2em;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 700;
}

.container {
  max-width: 760px;
  margin: 1.5em auto;
  background: #fff;
  padding: clamp(1.2em, 4vw, 2em);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(80, 20, 50, 0.12);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 1em;
}

.form-group label {
  display: block;
  font-weight: 700;
  margin-bottom: 0.4em;
}

select {
  width: 100%;
  padding: 0.7em;
  border-radius: 10px;
  border: 1px solid #c9a9b8;
  font: inherit;
  background: #fff;
}

button,
.btn-accion {
  display: inline-block;
  padding: 0.8em 1.5em;
  background: var(--rosa);
  color: #fff;
  font: 700 1em "DM Sans", Arial, sans-serif;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  text-decoration: none;
}

button:hover,
.btn-accion:hover { background: var(--rosa-hover); }

button.secundario {
  background: #fff;
  color: var(--rosa);
  border: 2px solid var(--rosa);
}

button:disabled { opacity: .6; cursor: not-allowed; }

:focus-visible {
  outline: 3px solid #5d1236;
  outline-offset: 2px;
}

.acciones {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8em;
  margin-top: 1.2em;
}

#simulador-una {
  margin-top: 1.5em;
  text-align: center;
}

#simulador-una h2 {
  font-size: 1.1em;
  margin: 0 0 .5em;
}

#mano {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 0.8em;
  padding: 1.2em 1em 1.6em;
  border-radius: 40px 40px 18px 18px;
  background: #e8c2a0;
  transition: background-color 0.3s ease;
}

.una-simulada {
  width: 44px;
  height: 78px;
  border-radius: 50% 50% 40% 40%;
  background: #f3e6ea;
  box-shadow: inset 0 -6px 10px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.25);
  transition: background-color 0.3s ease;
}

.una-simulada:nth-child(1) { height: 60px; }
.una-simulada:nth-child(3) { height: 88px; }
.una-simulada:nth-child(5) { height: 56px; }

#codigoColor {
  margin-top: 0.7em;
  font-weight: 700;
  min-height: 1.3em;
}

#resumen {
  margin-top: 1.2em;
  padding: 1em 1.2em;
  border-radius: 12px;
  background: #fbf1f6;
  border: 1px solid var(--borde);
  line-height: 1.55;
}

#resumen:empty { display: none; }

#bloques-colores {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 0.8em;
  margin-top: 1em;
}

.color-bloque {
  border: 2px solid transparent;
  border-radius: 12px;
  overflow: hidden;
  padding: 0;
  background: #fff;
  color: var(--tinta);
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  text-align: left;
}

.color-bloque[aria-pressed="true"] { border-color: var(--rosa); }

.color-muestra {
  display: block;
  height: 64px;
}

.color-nombre {
  display: block;
  padding: 6px 8px;
  font-size: 0.85em;
  font-weight: 700;
}

.color-nombre small {
  display: block;
  font-weight: 400;
  color: #6b4d5c;
}

.mensaje {
  margin-top: 1em;
  min-height: 1.2em;
}

.mensaje.error { color: #a0153e; }
.mensaje.success { color: #1d6b3d; }

.footer {
  background: #fff;
  text-align: center;
  padding: 1em 2em;
  color: #444;
  border-radius: 14px;
  max-width: 760px;
  margin: 0 auto;
}

.footer p { margin: .4em 0; }
.footer .icono { color: var(--rosa); margin-right: 6px; }
  </style>
</head>

<body>
  <header class="banner">
    <h1>Simulador de colorimetría para uñas</h1>
    <p>Elige tu tono de piel, tu subtono y la ocasión. Te sugerimos una paleta de esmaltes y el servicio ideal.</p>
    <a href="index.html" class="btn-volver">← Volver al inicio</a>
  </header>

  <main class="container">

    <form id="form-simulador">
      <div class="form-grid">

        <div class="form-group">
          <label for="piel">Tono de piel</label>
          <select id="piel" required>
            <option value="">-- Seleccionar --</option>
            <option value="clara">Clara</option>
            <option value="media">Media</option>
            <option value="triguena">Trigueña</option>
            <option value="morena">Morena</option>
            <option value="oscura">Oscura</option>
            <option value="ebano">Ébano</option>
          </select>
        </div>

        <div class="form-group">
          <label for="subtono">Subtono</label>
          <select id="subtono" required disabled>
            <option value="">Primero elige el tono</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ocasion">Ocasión</label>
          <select id="ocasion">
            <option value="diario">Día a día</option>
            <option value="oficina">Oficina / trabajo</option>
            <option value="fiesta">Fiesta / noche</option>
            <option value="evento">Boda o evento especial</option>
          </select>
        </div>

      </div>

      <div class="acciones">
        <button type="submit" id="btn-ver">Ver colores recomendados</button>
      </div>
    </form>

    <section id="simulador-una" aria-labelledby="titulo-vista">
      <h2 id="titulo-vista">Vista previa en mano</h2>
      <div id="mano" aria-hidden="true">
        <div class="una-simulada"></div>
        <div class="una-simulada"></div>
        <div class="una-simulada"></div>
        <div class="una-simulada"></div>
        <div class="una-simulada"></div>
      </div>
      <p id="codigoColor" role="status" aria-live="polite"></p>
    </section>

    <div id="resumen" aria-live="polite"></div>

    <div id="bloques-colores" role="group" aria-label="Colores recomendados"></div>

    <div class="acciones">
      <button type="button" id="btn-guardar" class="secundario" disabled>Guardar en mi cuenta</button>
      <a id="btn-reservar" class="btn-accion" href="index.html#citas" hidden>Reservar este servicio</a>
    </div>

    <p id="mensaje-simulador" class="mensaje" role="status" aria-live="polite"></p>

  </main>

  <footer class="footer">
    <p><span class="icono" aria-hidden="true">✦</span>AL Beauty Studio</p>
    <p><span class="icono" aria-hidden="true">✆</span>301 750 1031</p>
  </footer>

  <script type="module" src="Simulador.js?v=4"></script>
</body>
</html>
